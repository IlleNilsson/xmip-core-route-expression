# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-route-expression"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-route-expression"
description = "Expression route technology: `expression:<predicate>` evaluates a predicate over the context's promoted values through xmip-core-path-predicate and reads one truth. A xmip-core-route technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sdk = { package = "xmip-core-sdk", git = "https://github.com/IlleNilsson/xmip-core-sdk", branch = "main" }
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Source trait lives in route and takes a Message.
route = { package = "xmip-core-route", git = "https://github.com/IlleNilsson/xmip-core-route", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
# The predicate engine, the Path it takes and the reader trait it drives.
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main" }
path_predicate = { package = "xmip-core-path-predicate", git = "https://github.com/IlleNilsson/xmip-core-path-predicate", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }

[dev-dependencies]
# Only the tests build a Message from its parts.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
